<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AiAgent · F1 知识库问答</title>
  <style>
    :root{
      --bg:#F3F5F8; --panel:#FFFFFF; --line:#E6E9EF;
      --ink:#1B1F27; --muted:#6B7280; --soft:#8A94A6;
      --accent:#E10600; --accent-ok:#0F9D6E;
      --user-bubble:#1B1F27; --user-ink:#FFFFFF;
      --assistant-bubble:#FFFFFF; --shadow:0 1px 3px rgba(20,24,33,.06);
      --radius:14px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{background:var(--bg);color:var(--ink);font-family:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:15px;line-height:1.7}
    .app{max-width:960px;margin:0 auto;height:100vh;display:flex;flex-direction:column}
    header{padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex:0 0 auto}
    .logo{display:flex;align-items:center;gap:10px;min-width:0}
    .logo .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:0 0 auto}
    .logo h1{font-weight:700;font-size:15px;white-space:nowrap;margin:0}
    .logo .sub{font-size:12px;color:var(--muted);white-space:nowrap}
    .status{margin-left:auto;display:flex;align-items:center;gap:8px}
    .status .dot{width:8px;height:8px;border-radius:50%;background:var(--accent-ok);box-shadow:0 0 0 3px rgba(15,157,110,.15)}
    .status .mode-tag{font-size:12px;color:var(--muted)}

    main{flex:1 1 auto;overflow-y:auto;padding:24px 20px 12px}
    .chats{display:flex;flex-direction:column;gap:16px;max-width:820px;margin:0 auto}
    .row{display:flex;gap:10px;align-items:flex-start;max-width:640px}
    .row.user{align-self:flex-end;flex-direction:row-reverse}
    .row .avatar{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
    .row.assistant .avatar{background:#E9EBEF;color:var(--ink)}
    .row.user .avatar{background:var(--accent);color:#fff}
    .bubble{padding:11px 14px;border-radius:var(--radius);white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:var(--shadow)}
    .row.assistant .bubble{background:var(--assistant-bubble);border:1px solid var(--line);border-top-left-radius:4px}
    .row.user .bubble{background:var(--user-bubble);color:var(--user-ink);border-top-right-radius:4px}
    .bubble b{font-weight:700}
    .sources{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px}
    .src{font-size:11.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:2px 9px;border-radius:999px}
    .saved-note{font-size:12px;color:var(--accent-ok);margin-top:7px;font-weight:600}
    .typing{display:inline-flex;gap:4px;align-items:center;padding:4px 2px}
    .typing i{width:6px;height:6px;border-radius:50%;background:var(--soft);animation:blink 1.2s infinite}
    .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
    @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
    @media (prefers-reduced-motion:reduce){
      .typing i{animation:none}
      .chip,.send{transition:none}
    }
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

    .chips{max-width:820px;margin:6px auto 4px;display:flex;flex-wrap:wrap;gap:8px}
    .chip{font-size:12.5px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;transition:.15s}
    .chip:hover{border-color:var(--accent);color:var(--accent)}

    footer{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);padding:14px 20px calc(16px + env(safe-area-inset-bottom))}
    .composer{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:8px}
    .composer:focus-within{border-color:var(--accent)}
    textarea{flex:1;border:none;background:transparent;resize:none;font:inherit;color:var(--ink);line-height:1.5;max-height:140px;min-height:26px;outline:none;padding:4px 6px}
    .send{width:38px;height:38px;flex:0 0 auto;border:none;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .send:disabled{opacity:.4;cursor:not-allowed}
    .send svg{width:18px;height:18px}
    .foot-note{max-width:820px;margin:8px auto 0;font-size:11.5px;color:var(--soft);text-align:center}

    @media(max-width:560px){
      .logo .sub{display:none}
      .chips{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}
      .row{max-width:92%}
    }
    @media print{
      .app{height:auto}
      main{overflow:visible}
      footer,.chips,.status{display:none}
      .row{break-inside:avoid}
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">
        <div class="mark" aria-hidden="true">F1</div>
        <div>
          <h1>AiAgent · F1 知识库问答</h1>
          <div class="sub">中英改写 · 语义检索 · 重排 · LLM 生成 · 来源可溯</div>
        </div>
      </div>
      <div class="status">
        <span class="dot" aria-hidden="true"></span>
        <span class="mode-tag">已连接 · 知识库就绪</span>
      </div>
    </header>

    <main id="main"><div class="chats" id="chats"></div></main>
    <div class="chips" id="chips"></div>

    <footer>
      <div class="composer">
        <textarea id="q" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行…"></textarea>
        <button class="send" id="btn" onclick="ask()" aria-label="发送">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 11l18-8-8 18-2.5-7.5L3 11z" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="foot-note">回答带 [来源: …] 标注；回复「把上面的答案保存到本地」可写入本地文件。</div>
    </footer>
  </div>

  <script>
    var busy = false;
    var lastAssistant = '';   // plain text of the latest assistant reply

    var SUGGEST = ["什么是 Active Aero？", "2026 引擎有哪些变化？", "2008 巴西站发生了什么？", "把上面的答案保存到本地"];

    function el(tag, cls, html){
      var n = document.createElement(tag);
      if(cls) n.className = cls;
      if(html != null) n.innerHTML = html;
      return n;
    }
    function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function md(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>'); }
    function scrollToEnd(){ document.getElementById('main').scrollTop = document.getElementById('main').scrollHeight; }

    function addRow(role, text, sources, saved){
      var chats = document.getElementById('chats');
      var row = el('div','row ' + role);
      row.appendChild(el('div','avatar', role === 'user' ? '我' : 'AI'));
      var bubble = el('div','bubble', md(text));
      row.appendChild(bubble);
      chats.appendChild(row);
      if(role === 'assistant'){
        lastAssistant = text;
        if(sources && sources.length){
          var box = el('div','sources');
          sources.forEach(function(s){ box.appendChild(el('span','src','来源 ' + esc(s))); });
          bubble.appendChild(box);
        }
        if(saved) bubble.appendChild(el('div','saved-note','✓ 已保存到本地 answers/'));
      }
      scrollToEnd();
    }

    function addTyping(){
      var row = el('div','row assistant');
      row.appendChild(el('div','avatar','AI'));
      var b = el('div','bubble');
      b.appendChild(el('span','typing','<i></i><i></i><i></i>'));
      row.appendChild(b);
      document.getElementById('chats').appendChild(row);
      scrollToEnd();
      return row;
    }

    // Extract [来源: ...] markers into chips.
    function renderAnswer(text){
      var sources = [];
      var cleaned = text.replace(/\[来源[:：]\s*([^\]]+)\]/g, function(m, s){
        s.split(/[、,，]/).forEach(function(x){ x = x.trim(); if(x && sources.indexOf(x) < 0) sources.push(x); });
        return '';
      });
      return {text: cleaned, sources: sources};
    }

    async function ask(question){
      if(busy) return;
      var q = (question || document.getElementById('q').value).trim();
      if(!q) return;
      document.getElementById('q').value = '';
      autoGrow(document.getElementById('q'));
      addRow('user', q);
      var prevAnswer = lastAssistant;   // carry latest answer so save follow-ups can persist it
      busy = true;
      document.getElementById('btn').disabled = true;
      var t = addTyping();
      try{
        var res = await fetch('/query', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({question:q, previous_answer: prevAnswer || ''})
        });
        var data = await res.json();
        if(!res.ok) throw new Error(data.detail || data.error || '请求失败');
        t.remove();
        var parsed = renderAnswer(data.answer);
        addRow('assistant', parsed.text, parsed.sources, !!data.saved);
      }catch(e){
        t.remove();
        addRow('assistant', '出错了：' + e.message);
      }finally{
        busy = false;
        document.getElementById('btn').disabled = false;
        document.getElementById('q').focus();
      }
    }

    function autoGrow(x){ x.style.height='auto'; x.style.height=Math.min(x.scrollHeight,140)+'px'; }

    var q = document.getElementById('q');
    q.addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); ask(); } });
    q.addEventListener('input', function(){ autoGrow(q); });

    var chipsBox = document.getElementById('chips');
    SUGGEST.forEach(function(text){
      var c = el('button','chip', esc(text));
      c.onclick = function(){ ask(text); };
      chipsBox.appendChild(c);
    });

    addRow('assistant', '你好，我是 **AiAgent**，一个基于 RAG 的 F1 知识库问答助手。\n可以问我规则术语、引擎变化、历史车手或经典比赛，也可以让我把回答保存到本地。点下方的示例问题，或直接输入你的问题吧。');
    document.getElementById('q').focus();
  </script>
</body>
</html>
